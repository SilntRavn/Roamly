# Standalone instance: does not load or change nginx's default port-80 configuration.
worker_processes 1;
pid C:/WorkSpace/Prj/RoamlyNew/deploy/run/nginx.pid;
error_log C:/WorkSpace/Prj/RoamlyNew/deploy/run/nginx-error.log;
events { worker_connections 1024; }
http {
    include C:/WorkSpace/nginx-1.30.2/conf/mime.types;
    default_type application/octet-stream;
    access_log C:/WorkSpace/Prj/RoamlyNew/deploy/run/nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    server {
        listen 18080;
        server_name 6.6.6.6 localhost;
        root C:/WorkSpace/Prj/RoamlyNew/dist;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        location /api/ {
            proxy_pass http://127.0.0.1:24173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
        }
        location /_AMapService/ {
            proxy_pass http://127.0.0.1:24173;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location = /download/roamly.apk {
            alias C:/WorkSpace/Prj/RoamlyNew/artifacts/apk/Roamly-1.0.2-arm64.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="Roamly-1.0.2-arm64.apk"';
            add_header Cache-Control 'no-store';
        }
        location = /index.html { add_header Cache-Control 'no-cache'; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
